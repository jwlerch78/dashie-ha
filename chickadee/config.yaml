name: Chickadee
version: "0.1.0"
# Slug is IMMUTABLE once shipped (a slug change = a different add-on with an
# orphaned /data). Born `chickadee` — see chickadee CONTRACTS.md.
slug: chickadee
description: The Chickadee brain runtime — conversation brain + engine routing for the Chickadee integration. Point it at any OpenAI-compatible model server (Ollama, llama.cpp, vLLM, or a provider's compat endpoint with your own key).
url: https://github.com/jwlerch78/chickadee-addons
arch:
  - aarch64
  - amd64
  - armv7

# Minimum HA version (any recent HA is fine).
homeassistant: "2024.1.0"

# data:rw                — private persistent storage (bridge secret master copy, later config).
# addon_config:rw        — the add-on's OWN config folder (/addon_configs/<slug>/ on the host).
#                          NOT visible to HA Core on HAOS (verified 2026-07-25) — kept for the
#                          future Supervisor-discovery handoff.
# homeassistant_config:rw — the HA config dir; carries the bridge secret at
#                          .chickadee/bridge_secret so the integration can read it.
#                          INTERIM: any add-on with a config mount can read it too —
#                          replace with Supervisor discovery (CONTRACTS.md).
map:
  - data:rw
  - addon_config:rw
  - homeassistant_config:rw

# The integration reaches us on the internal hassio network at
# http://<hostname>:8099 — no host ports published.
ports: {}

# llm_url:     base URL of an OpenAI-compatible model server (no trailing /v1),
#              e.g. http://homeassistant.local:11434 (Ollama) or a provider's
#              compat endpoint. llm_model: the model id to run. llm_api_key:
#              bearer key — leave blank for local Ollama/llama.cpp.
options:
  log_level: info
  llm_url: ""
  llm_model: ""
  llm_api_key: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  llm_url: str?
  llm_model: str?
  llm_api_key: password?
