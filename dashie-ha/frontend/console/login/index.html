<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashie Console — Signing In</title>
    <link rel="icon" type="image/png" href="../assets/dashie-icon.png">
    <link rel="apple-touch-icon" href="../assets/dashie-icon.png">
    <style>
        body {
            margin: 0;
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #111827;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ef4444; display: none; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div>Completing sign-in...</div>
        <div class="error" id="error"></div>
    </div>
    <!-- Vendored, not CDN-loaded. This is the SIGN-IN page: a third-party
         request here would happen before the user has an account at all.
         See ../vendor/README.md. -->
    <script src="../vendor/supabase-js-2.111.0.min.js"></script>
    <script src="../js/lib/console-auth.js"></script>
    <script src="../js/lib/console-apple-signin.js"></script>
    <script>
        // OAuth callback handler. Google redirects here with ?code=...&state=...
        // Apple (D-448) comes back as ?apple_return=ok|cancelled|error from apple-web-callback.
        // Exchange / poll, set the JWT, redirect back to console root.
        (async function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const appleOutcome = ConsoleAppleSignIn.readReturn(window.location.search);
                if (appleOutcome) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    const r = await ConsoleAppleSignIn.complete({
                        outcome: appleOutcome,
                        edgeFunctionUrl: DashieAuth.edgeFunctionUrl,
                        anonKey: DashieAuth.anonKey,
                        setJWT: (jwt) => DashieAuth.setJWT(jwt),
                    });
                    if (r.status === 'signed_in') {
                        try {
                            if (r.user?.email) localStorage.setItem('dashie-user-data', JSON.stringify({
                                name: r.user.name || '', email: r.user.email, picture: r.user.picture || '',
                            }));
                        } catch (_) {}
                        window.location.href = '../';
                        return;
                    }
                    if (r.status === 'cancelled') { window.location.href = '../'; return; }
                    throw new Error('Apple sign-in did not complete. Please try again.');
                }
                if (!params.has('code')) {
                    window.location.href = '../';
                    return;
                }

                await DashieAuth._handleOAuthCallback(params);

                // Redirect to console root (one level up from /login/)
                window.location.href = '../';
            } catch (e) {
                console.error('Sign-in failed:', e);
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = e.message;
            }
        })();
    </script>
</body>
</html>
