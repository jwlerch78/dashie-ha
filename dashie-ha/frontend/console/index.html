<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashie Console</title>
    <link rel="icon" type="image/png" href="assets/dashie-icon.png">
    <link rel="apple-touch-icon" href="assets/dashie-icon.png">
    <link rel="stylesheet" href="css/console.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar" class="sidebar"></aside>
        <main id="main">
            <!-- Global banner slot ABOVE the top bar (deletion / integration-
                 restart / expired share it — see App._renderGlobalBanner). -->
            <div id="global-banner"></div>
            <header id="top-bar" class="top-bar"></header>
            <div id="content" class="content"></div>
        </main>
    </div>

    <!-- Supabase JS SDK (for real-time broadcasts). VENDORED, not CDN-loaded —
         see vendor/README.md: an add-on panel must not phone a third party to
         render, must work on an air-gapped box, and must run the code that is
         actually in this repo. -->
    <script src="vendor/supabase-js-2.111.0.min.js"></script>
    <!-- Pinned to HA frontend's exact version (see home-assistant/frontend
         package.json) so we run the same hls.js code HA's <ha-hls-player>
         uses. Version drift here was producing bufferAppendError on streams
         that play fine in HA's UI. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.light.min.js"></script>

    <!-- heic2any: HEIC → JPEG conversion used by photo-file-processor on
         desktop upload. Same pin as the dashboard's photos-settings.html. -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <!-- Core -->
    <!-- brand.js FIRST: every later script may read window.BRAND -->
    <script src="js/lib/brand.js?v=20260727a"></script>
    <script src="js/lib/console-auth.js?v=20260727c"></script>
    <script src="js/lib/feature-gate.js?v=20260727c"></script>
    <script src="js/lib/option-catalog.js?v=20260712a"></script>
    <script src="js/lib/console-state.js?v=20260712a"></script>
    <script src="js/lib/personality-prompt-builder.js?v=20260712a"></script>
    <script src="js/lib/ai-prompt-templates.js?v=20260712a"></script>
    <script src="js/lib/ai-models-catalog.js?v=20260712a"></script>
    <script src="js/lib/prompt-builder.js?v=20260727a"></script>
    <script src="js/lib/console-intent-classifier.js?v=20260712a"></script>
    <script src="js/lib/console-ai-client.js?v=20260725b"></script>
    <script src="js/lib/settings-sync.js?v=20260712a"></script>
    <script src="js/lib/feeds-api.js?v=20260712a"></script>
    <script src="js/lib/voice-ai-api.js?v=20260727c"></script>
    <script src="js/lib/photo-file-processor.js?v=20260712a"></script>
    <script src="js/lib/credits-service.js?v=20260712a"></script>
    <script src="js/lib/history-chart.js?v=20260712a"></script>
    <script src="js/lib/mock-data.js?v=20260727a"></script>
    <script src="js/components/sidebar.js?v=20260727e"></script>
    <script src="js/components/top-bar.js?v=20260727a"></script>
    <script src="js/components/login-email.js?v=20260727a"></script>
    <script src="js/components/card.js?v=20260727a"></script>
    <script src="js/components/form-fields.js?v=20260712a"></script>
    <script src="js/components/data-table.js?v=20260712a"></script>
    <script src="js/components/emoji-picker.js?v=20260712a"></script>
    <script src="js/components/options-modal.js?v=20260712a"></script>
    <script src="js/components/confirm-modal.js?v=20260712a"></script>
    <script src="js/components/feedback-modal.js?v=20260725b"></script>
    <script src="js/components/toast.js?v=20260725b"></script>
    <script src="js/components/buy-credits-modal.js?v=20260729a"></script>
    <script src="js/components/autorefill-modal.js?v=20260725b"></script>
    <script src="js/components/credits-controls.js?v=20260712a"></script>

    <!-- Pages -->
    <script src="js/pages/voice-ai-personality-edit.js?v=20260712a"></script>
    <script src="js/pages/voice-ai-chat.js?v=20260725a"></script>
    <script src="js/pages/voice-ai-analysis.js?v=20260725a"></script>
    <script src="js/pages/voice-ai-benchmark.js?v=20260712a"></script>
    <!-- engine-resolution.js is GENERATED (contract #29) and must load BEFORE
         engines-store.js, which reads window.ENGINE_RESOLUTION from it. -->
    <script src="js/lib/engine-resolution.js?v=20260716a"></script>
    <script src="js/lib/engines-store.js?v=20260716a"></script>
    <script src="js/lib/voice-ai-options.js?v=20260728d"></script>
    <script src="js/components/voice-ai-cards.js?v=20260712a"></script>
    <script src="js/components/voice-ai-preset-picker.js?v=20260729b"></script>
    <script src="js/components/voice-ai-defaults-cards.js?v=20260712a"></script>
    <script src="js/pages/voice-ai.js?v=20260729b"></script>
    <script src="js/pages/scheduled-actions.js?v=20260725b"></script>
    <script src="js/components/usage-chart.js?v=20260712a"></script>
    <script src="js/pages/account-usage.js?v=20260727a"></script>
    <script src="js/pages/account.js?v=20260727d"></script>
    <script src="js/pages/credits.js?v=20260712a"></script>
    <script src="js/pages/api-keys.js?v=20260725b"></script>
    <script src="js/pages/local-engines.js?v=20260725b"></script>

    <!-- DELTA-SCRIPTS-BEGIN
         Open-core build: this block is EMPTY by design. In the Dashie build
         it carries that product's private page/plan modules (vendored from
         this repo + a delta overlay — see PROVENANCE.md). Every core call
         into those modules is guarded (`window.X?.`) and no-ops here. -->
    <!-- DELTA-SCRIPTS-END -->

    <!-- App -->
    <script src="js/app.js?v=20260728b"></script>
</body>
</html>
