name: Dashie
version: "0.8.6"
# Slug is IMMUTABLE once shipped (a slug change = a different add-on with an
# orphaned /data). Born `chickadee`, renamed to `dashie_ha` on
# 2026-07-30, BEFORE anything shipped. See the integration repo CONTRACTS.md.
slug: dashie_ha
description: Voice & AI for Home Assistant — plug and play. Gives your voice assistant a real brain — ask anything, control your home in plain language, and hear natural voices back. Bring your own AI (local or your API key) or use Dashie Cloud. Sets up the Dashie Voice integration and a ready-to-use voice assistant for you.
url: https://github.com/jwlerch78/dashie-ha-console
arch:
  - aarch64
  - amd64
  - armv7

# Minimum HA version (any recent HA is fine).
homeassistant: "2024.1.0"

# Supervisor API access (SUPERVISOR_TOKEN) — publishes the bridge secret via
# Supervisor discovery (the same credential channel the MQTT broker and Wyoming
# add-ons use) and lists add-ons for engine detection. `discovery` declares the
# service we publish. homeassistant_api lets the console's engine detection
# talk to HA's WebSocket API (tts/engine/list & co — WS-only surface).
hassio_api: true
homeassistant_api: true
# manager role: the console's "Restart Home Assistant" button (the integration
# installer needs a core restart to activate; the banner offers it one-click).
hassio_role: manager
discovery:
  - dashie_voice

# BYO provider keys + the account-config replay cache live in /data and carry
# secrets — keep them out of HA backups (same posture as the Dashie add-on).
backup_exclude:
  - api-keys.json
  - account-config.cache.json
  # turns.jsonl is the PER-TURN history (row 80). Excluded in the SAME commit that
  # creates it, deliberately. The sibling usage.json is NOT excluded and its own
  # header argues why — "no text, no ids and no keys" — but that argument was made
  # on the premise that per-turn data does not exist, and this file is that premise
  # being removed. A timestamped sequence of voice interactions is a presence
  # record: when the house is awake, when it is empty. /data rides into HA add-on
  # backups, including ones uploaded to cloud backup targets, so shipping this
  # without the line below would put a household's occupancy log wherever that
  # household points its backups.
  - turns.jsonl

# Ingress panel: the Dashie sign-in/status page (open-console seed), served
# by the same server on 8099. HA proxies frontend traffic in; nothing is
# LAN-exposed (ports stays {}).
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: Dashie

# data:rw                — private persistent storage (bridge secret master copy, later config).
# addon_config:rw        — the add-on's OWN config folder (/addon_configs/<slug>/ on the host).
#                          NOT visible to HA Core on HAOS (verified 2026-07-25) — kept for the
#                          future Supervisor-discovery handoff.
# homeassistant_config:rw — the HA config dir; carries the bridge secret at
#                          .dashie_voice/bridge_secret so the integration can read it.
#                          INTERIM: any add-on with a config mount can read it too —
#                          replace with Supervisor discovery (CONTRACTS.md).
map:
  - data:rw
  - addon_config:rw
  - homeassistant_config:rw

# The integration reaches us on the internal hassio network at
# http://<hostname>:8099 — no host ports published.
ports: {}

# llm_url / llm_model / llm_api_key were REMOVED 2026-08-21 (John's ruling: the
# web UI is the only brain-config surface — "we don't want those fields in the
# config at all, it's just confusing"). Configure your own model server on the
# panel's Voice & AI page instead ("My own AI (local / self-hosted)"); the
# server resolves it from the account (or, signed out, from the panel's local
# settings). COMPAT: a box whose stored options still carry the old keys gets
# them stripped by the Supervisor's schema validation (warning in the
# Supervisor log); the server no longer reads them either way, and converse.js
# logs a loud DROP naming the migration if it finds them.
# stt_url: an OpenAI-compatible transcription server (we append
#          /v1/audio/transcriptions unless the URL already ends with it) —
#          whisper.cpp server, faster-whisper/speaches, or a provider endpoint.
# tts_url: an OpenAI-compatible speech server (we append /v1/audio/speech) —
#          Kokoro-FastAPI, the Piper shim, or a provider endpoint.
# cloud_env: which Dashie Cloud environment a signed-in account uses.
# During the beta, Dashie Cloud accounts run on the `beta` environment
# (dev.dashieapp.com auth) — disclosed in DOCS.md; `stable`
# (app.dashieapp.com) is where accounts move when the beta ends.
# `development`/`production` are accepted as legacy aliases.
# install_integration: the add-on installs/updates the bundled Dashie Voice
# integration into /config/custom_components (never touches a HACS/manual
# install; see server/integration-installer.js). Off = manage it yourself.
options:
  # Capability-lease TTL in minutes (CONTRACTS #65). Bounds the worst-case delay
  # between turning household sharing off and a satellite noticing. Clamped
  # 5..240 in server/config.js — a 0 would expire every lease on arrival.
  lease_ttl_minutes: 30
  cloud_env: dev
  install_integration: true
  stt_url: ""
  stt_model: "whisper-1"
  stt_api_key: ""
  tts_url: ""
  tts_voice: ""
  tts_api_key: ""
  # ── ENFORCEMENT RUNGS (both default OFF, deliberately) ────────────────────
  # Two observe->enforce ladders were designed and neither rung was ever built:
  # the code reads these from add-on options, they were in no schema, so they
  # could never be true and enforcement was unreachable on every box.
  #
  # service_policy_enforce: refuse HA service calls outside the allowlist
  #   (server/ha-service-policy.js). OFF records what it WOULD refuse; ON
  #   refuses. Flip per box, after checking the DROP: markers on THAT box --
  #   the risky set is not knowable from the code, since /service is an
  #   LLM-driven passthrough.
  #
  # (A second rung, ai_auth_enforce, was removed 2026-08-23: it was declared here
  # and read NOWHERE, so it could never do anything. #48.)
  #
  # Default OFF is the whole point: enabling by default would enforce on every
  # box that takes a release, which is an estate-wide behaviour change rather
  # than a rollout.
  service_policy_enforce: false
schema:
  service_policy_enforce: bool?
  lease_ttl_minutes: int(5,240)?
  # dev|prod are the current names; the rest are accepted legacy aliases and are
  # listed ONLY so a box already storing one stays valid (server/config.js
  # ENV_ALIASES maps them). Narrow this once the estate has converged.
  cloud_env: list(dev|prod|beta|stable|development|production)
  install_integration: bool?
  stt_url: str?
  stt_model: str?
  stt_api_key: password?
  tts_url: str?
  tts_voice: str?
  tts_api_key: password?
