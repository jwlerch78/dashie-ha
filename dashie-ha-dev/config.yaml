name: Dashie (Dev)
version: "0.9.20"
# Slug is IMMUTABLE once shipped (a slug change = a different add-on with an
# orphaned /data). This is the DEV channel — born `dashie_ha_dev`, separate
# from prod's `dashie_ha` so it installs alongside with its own /data + login.
# The add-on source (server/, frontend/, integration/) is a MIRROR of the
# canonical `dashie-ha/` folder, refreshed by `release.sh --channel dev`
# (generated — never hand-edit under dashie-ha-dev/ except this config.yaml).
slug: dashie_ha_dev
description: "[DEV BUILD] Voice & AI for Home Assistant — plug and play. Test channel for the Dashie for Home Assistant add-on; installs alongside the stable one. Do not install both started on the same box (discovery collision)."
url: https://github.com/jwlerch78/dashie-ha-console
arch:
  - aarch64
  - amd64
  - armv7

# Minimum HA version (any recent HA is fine).
homeassistant: "2024.1.0"

# Supervisor API access (SUPERVISOR_TOKEN) — publishes the bridge secret via
# Supervisor discovery (the same credential channel the MQTT broker and Wyoming
# add-ons use) and lists add-ons for engine detection. `discovery` declares the
# service we publish. homeassistant_api lets the console's engine detection
# talk to HA's WebSocket API (tts/engine/list & co — WS-only surface).
hassio_api: true
homeassistant_api: true
# manager role: the console's "Restart Home Assistant" button (the integration
# installer needs a core restart to activate; the banner offers it one-click).
hassio_role: manager
# Publishes the SAME discovery service as prod (`dashie_voice`) so the Dashie Voice
# integration discovers it normally — which is why only ONE Dashie-for-HA add-on
# should be STARTED on a given box.
discovery:
  - dashie_voice

# BYO provider keys + the account-config replay cache live in /data and carry
# secrets — keep them out of HA backups (same posture as the Dashie add-on).
backup_exclude:
  - api-keys.json
  - account-config.cache.json

# Ingress panel: the Dashie sign-in/status page (open-console seed), served
# by the same server on 8099. HA proxies frontend traffic in; nothing is
# LAN-exposed (ports stays {}).
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: Dashie (Dev)

# data:rw                — private persistent storage (bridge secret master copy, later config).
# addon_config:rw        — the add-on's OWN config folder (/addon_configs/<slug>/ on the host).
#                          NOT visible to HA Core on HAOS (verified 2026-07-25) — kept for the
#                          future Supervisor-discovery handoff.
# homeassistant_config:rw — the HA config dir; carries the bridge secret at
#                          .dashie_voice/bridge_secret so the integration can read it.
#                          INTERIM: any add-on with a config mount can read it too —
#                          replace with Supervisor discovery (CONTRACTS.md).
map:
  - data:rw
  - addon_config:rw
  - homeassistant_config:rw

# The integration reaches us on the internal hassio network at
# http://<hostname>:8099 — no host ports published.
ports: {}

# cloud_env: which Dashie Cloud environment a signed-in account uses.
# The dev channel defaults to `beta` (staging) so test sign-ins hit the
# staging backend — see DOCS.md; `stable` (app.dashieapp.com) is prod.
# ── COMPOSED FROM canonical dashie-ha/config.yaml — DO NOT HAND-EDIT BELOW ──
options:
  # Capability-lease TTL in minutes (CONTRACTS #65). Bounds the worst-case delay
  # between turning household sharing off and a satellite noticing. Clamped
  # 5..240 in server/config.js — a 0 would expire every lease on arrival.
  lease_ttl_minutes: 30
  cloud_env: beta
  install_integration: true
  stt_url: ""
  stt_model: "whisper-1"
  stt_api_key: ""
  tts_url: ""
  tts_voice: ""
  tts_api_key: ""
  # ── ENFORCEMENT RUNGS (both default OFF, deliberately) ────────────────────
  # Two observe->enforce ladders were designed and neither rung was ever built:
  # the code reads these from add-on options, they were in no schema, so they
  # could never be true and enforcement was unreachable on every box.
  #
  # service_policy_enforce: refuse HA service calls outside the allowlist
  #   (server/ha-service-policy.js). OFF records what it WOULD refuse; ON
  #   refuses. Flip per box, after checking the DROP: markers on THAT box --
  #   the risky set is not knowable from the code, since /service is an
  #   LLM-driven passthrough.
  #
  # (A second rung, ai_auth_enforce, was removed 2026-08-23: it was declared here
  # and read NOWHERE, so it could never do anything. #48.)
  #
  # Default OFF is the whole point: enabling by default would enforce on every
  # box that takes a release, which is an estate-wide behaviour change rather
  # than a rollout.
  service_policy_enforce: false
  # ⚠️ DEV CHANNEL ONLY — seconds, and it OVERRIDES the minutes above.
  # Declared here and deliberately NOT in the prod channel's schema, so Home
  # Assistant rejects it there before it can reach the add-on. That absence is
  # the whole enforcement: no code branch, and no way to leave a 60-second
  # revocation window running in a real household by accident.
  # 0 / unset = off. Exists so the lease test suite costs minutes rather than
  # the 3+ hours a real 30-minute TTL prices it at — without it the suite is
  # priced like a soak and stops being run, which is how a revocation mechanism
  # silently rots.
  lease_ttl_seconds: 0
schema:
  service_policy_enforce: bool?
  lease_ttl_minutes: int(5,240)?
  cloud_env: list(beta|stable|development|production)
  install_integration: bool?
  stt_url: str?
  stt_model: str?
  stt_api_key: password?
  tts_url: str?
  tts_voice: str?
  tts_api_key: password?

  lease_ttl_seconds: int(0,14400)?
# ── END COMPOSED ──
